name: Regenerate i18n files

on:
  push:
    branches:
      - production
      - dev
      - dependabot/npm_and_yarn/*
      - feature/*
      - bug/*
    paths:
      - '.github/workflows/i18n.yml'
      - 'workers/customer/languageGenerate.mts'
      - 'workers/customer/messages/**'
      - 'workers/customer/project.inlang/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose an environment to deploy to:'
        required: true
        type: environment

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: ${{ (inputs.environment || github.ref_name) == 'production' && 'production' || 'preview' }}
      url: https://${{ (inputs.environment || vars.ENVIRONMENT) != 'production' && format('{0}.', (inputs.environment || vars.ENVIRONMENT)) || '' }}dash.eaas.autosec.network
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Git Setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'
      - run: npm ci --ignore-scripts --include-workspace-root --workspace customer
      - run: npm run-script install --if-present --include-workspace-root --workspace customer
      - name: Restore i18n build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            workers/customer/project.inlang/cache/**
            workers/customer/src/paraglide/**
          key: customer-i18n-${{ github.ref_name }}-${{ hashFiles('workers/customer/messages/**', 'workers/customer/project.inlang/settings.json') }}
          restore-keys: |
            customer-i18n-${{ github.ref_name }}-
          enableCrossOsArchive: true
      - run: npm --workspace customer run build:translate
        if: github.actor != 'autosec-prettier[bot]'
      - name: Save i18n build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref_name == 'production' || github.ref_name == 'dev' }}
        with:
          path: |
            workers/customer/project.inlang/cache/**
            workers/customer/src/paraglide/**
          key: customer-i18n-${{ github.ref_name }}-${{ hashFiles('workers/customer/messages/**', 'workers/customer/project.inlang/settings.json') }}
          enableCrossOsArchive: true
      - run: git commit -m "Generated i18n" workers/customer/messages/** || echo "No i18n generation done"
        if: github.actor != 'autosec-prettier[bot]'
      - run: git push
        if: github.actor != 'autosec-prettier[bot]'
