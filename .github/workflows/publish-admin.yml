name: Publish Admin Dashboard

on:
  push:
    branches:
      - production
      - dev
      - dependabot/npm_and_yarn/*
      - feature/*
      - bug/*
    paths:
      - '.github/workflows/publish-admin.yml'
      - 'eslint.config.mjs'
      - 'prettier.config.mjs'
      - 'package*.json'
      - 'tsconfig.json'
      - 'shared/**'
      - 'workers/tsconfig.json'
      - 'workers/admin/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose an environment to deploy to:'
        required: true
        type: environment

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: ${{ (inputs.environment || github.ref_name) == 'production' && 'production' || 'preview' }}
      url: https://admin.eaas.autosec.network
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Git Setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'
      - run: npm ci --ignore-scripts --include-workspace-root --workspace admin --workspace db --workspace helpers --workspace types
      - run: npm run-script install --if-present --include-workspace-root --workspace admin --workspace db --workspace helpers --workspace types
      - run: npm --workspace types run build
      - run: npm --workspace helpers run build
      - run: npm --workspace db run build
      - name: Restore TS build cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            workers/admin/tmp/tsconfig.tsbuildinfo
          key: admin-ts-${{ github.ref_name }}-${{ hashFiles('workers/admin/tmp/tsconfig.tsbuildinfo') }}
          restore-keys: |
            admin-ts-${{ github.ref_name }}-
          enableCrossOsArchive: true
      - run: npm --workspace admin run build:types:cf
      - run: git commit -m "Generate cf types" workers/customer/worker-configuration.d.ts || echo "No type generation done"
        if: github.actor != 'autosec-prettier[bot]'
      - run: git push
        if: github.actor != 'autosec-prettier[bot]'
        continue-on-error: true
      - run: npm --workspace admin run build:types:tsc
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Save TS build cache
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        if: ${{ github.ref_name == 'production' || github.ref_name == 'dev' }}
        with:
          path: |
            workers/admin/tmp/tsconfig.tsbuildinfo
          key: admin-ts-${{ github.ref_name }}-${{ hashFiles('workers/admin/tmp/tsconfig.tsbuildinfo') }}
          enableCrossOsArchive: true
      - name: Restore Vite client build cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            workers/admin/dist/.vite
          key: admin-vite-client-${{ github.ref_name }}-${{ hashFiles('**/package-lock.json', 'workers/admin/vite.config.ts', 'workers/admin/tsconfig.json') }}
          restore-keys: |
            admin-vite-client-${{ github.ref_name }}-
          enableCrossOsArchive: true
      - run: npm --workspace admin run build.client
      - name: Save Vite client build cache
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        if: ${{ github.event_name != 'pull_request_target' }}
        with:
          path: |
            workers/admin/dist/.vite
          key: admin-vite-client-${{ github.ref_name }}-${{ hashFiles('**/package-lock.json', 'workers/admin/vite.config.ts', 'workers/admin/tsconfig.json') }}
          enableCrossOsArchive: true
      - name: Restore Vite server build cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            workers/admin/server/.vite
          key: admin-vite-server-${{ github.ref_name }}-${{ hashFiles('**/package-lock.json', 'workers/admin/vite.config.ts', 'workers/admin/tsconfig.json') }}
          restore-keys: |
            admin-vite-server-${{ github.ref_name }}-
          enableCrossOsArchive: true
      - run: npm --workspace admin run build.server
      - name: Save Vite server build cache
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        if: ${{ github.event_name != 'pull_request_target' }}
        with:
          path: |
            workers/admin/server/.vite
          key: admin-vite-server-${{ github.ref_name }}-${{ hashFiles('**/package-lock.json', 'workers/admin/vite.config.ts', 'workers/admin/tsconfig.json') }}
          enableCrossOsArchive: true
      - run: npm --workspace admin run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Get Wrangler Version
        run: echo "wrangler_version=$(npm ls wrangler --depth=0 --json | jq -r '.dependencies.wrangler.version')" >> $GITHUB_OUTPUT
        id: npm_wrangler_version
      - name: Deploying to Cloudflare's global network
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        if: ${{ github.ref_name == 'production' }}
        id: wrangler_deploy
        with:
          wranglerVersion: ${{ steps.npm_wrangler_version.outputs.wrangler_version }}
          apiToken: ${{ secrets.WORKER_DEPLOY_CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/admin
          vars: |
            GIT_HASH
            CF_ACCOUNT_ID
          secrets: |
            AUTH_SECRET_DEV
            AUTH_SECRET_PROD
            CF_API_TOKEN
        env:
          GIT_HASH: ${{ github.sha }}
          AUTH_SECRET_DEV: ${{ secrets.AUTH_SECRET_DEV }}
          AUTH_SECRET_PROD: ${{ secrets.AUTH_SECRET_PROD }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.ADMIN_CF_API_TOKEN }}
      - name: Dry-run deployment for validation
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        if: ${{ steps.wrangler_deploy.outcome == 'skipped' }}
        id: wrangler_dry_run
        with:
          wranglerVersion: ${{ steps.npm_wrangler_version.outputs.wrangler_version }}
          apiToken: ${{ secrets.WORKER_DEPLOY_CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/admin
          command: deploy --dry-run
