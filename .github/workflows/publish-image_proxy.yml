name: Publish `image_proxy`

on:
  push:
    branches:
      - production
    paths:
      - '.github/workflows/publish-image_proxy.yml'
      - 'eslint.config.mjs'
      - 'prettier.config.mjs'
      - 'package*.json'
      - 'tsconfig.json'
      - 'snippets/tsconfig.json'
      - 'snippets/image_proxy/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  upload-snippet:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'
      - run: npm ci --ignore-scripts --include-workspace-root --workspace=image_proxy
      - run: npm run-script install --if-present --include-workspace-root --workspace image_proxy
      - run: npm --workspace=image_proxy run build
      - run: npm --workspace image_proxy run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: |
          curl --silent --fail-with-body --request PUT \
            --url https://api.cloudflare.com/client/v4/zones/${{ secrets.AUTOSEC_ZONE_ID }}/snippets/image_proxy \
            --header 'Content-Type: multipart/form-data' \
            --header 'Authorization: Bearer ${{ secrets.WORKER_DEPLOY_CF_API_TOKEN }}' \
            --form "files=@${{ github.workspace }}/snippets/image_proxy/dist/worker.js" \
            --form "metadata={\"main_module\": \"worker.js\"}"
