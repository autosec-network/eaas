name: Publish Logging

on:
  push:
    branches:
      - production
    paths:
      - '.github/workflows/publish-logging.yml'
      - 'eslint.config.mjs'
      - 'prettier.config.mjs'
      - 'package*.json'
      - 'tsconfig.json'
      - 'shared/**'
      - 'workers/tsconfig.json'
      - 'workers/logging/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose an environment to deploy to:'
        required: true
        type: environment

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: ${{ (inputs.environment || github.ref_name) == 'production' && 'production' || 'dev' }}
    steps:
      - uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Git Setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'
      - run: npm ci --ignore-scripts --include-workspace-root --workspace logging --workspace db --workspace types
      - run: npm run-script install --if-present --include-workspace-root --workspace logging --workspace db --workspace types
      - run: npm --workspace logging run build:types:cf
        if: github.actor != 'autosec-prettier[bot]'
      - run: git commit -m "Generate cf types" workers/logging/worker-configuration.d.ts || echo "No type generation done"
        if: github.actor != 'autosec-prettier[bot]'
      - run: git push
        if: github.actor != 'autosec-prettier[bot]'
        continue-on-error: true
      - run: npm --workspace logging run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Get Wrangler Version
        run: echo "wrangler_version=$(npm ls wrangler --depth=0 --json | jq -r '.dependencies.wrangler.version')" >> $GITHUB_OUTPUT
        id: npm_wrangler_version
      - uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        id: wrangler
        with:
          wranglerVersion: ${{ steps.npm_wrangler_version.outputs.wrangler_version }}
          apiToken: ${{ secrets.WORKER_DEPLOY_CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/logging
          environment: ${{ (vars.ENVIRONMENT == 'production' && 'prod') || '' }}
          vars: |
            GIT_HASH
        env:
          GIT_HASH: ${{ github.sha }}
